<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-nex - Almacenamiento de Archivos</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      text-align: center;
    }
    input[type="file"] {
      margin: 10px 0;
    }
    .file-list {
      margin-top: 20px;
    }
    .file-list a {
      display: block;
      margin: 5px 0;
      color: #007BFF;
      text-decoration: none;
    }
    .file-list a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>E-nex - Subir y Descargar Archivos</h1>
    <input type="file" id="fileInput" />
    <button id="uploadButton">Subir Archivo</button>
    <div class="file-list" id="fileList">
      <!-- Los enlaces de descarga aparecerán aquí -->
    </div>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_AUTH_DOMAIN",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_STORAGE_BUCKET",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    // Inicializar Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();

    // Elementos del DOM
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const fileList = document.getElementById("fileList");

    // Subir archivo a Firebase Storage
    uploadButton.addEventListener("click", () => {
      const file = fileInput.files[0];
      if (!file) {
        alert("Por favor, selecciona un archivo.");
        return;
      }

      const storageRef = storage.ref(file.name);
      storageRef.put(file).then(() => {
        alert("Archivo subido con éxito.");
        storageRef.getDownloadURL().then((url) => {
          displayDownloadLink(file.name, url);
        });
      }).catch((error) => {
        console.error("Error al subir el archivo:", error);
      });
    });

    // Mostrar enlace de descarga
    function displayDownloadLink(fileName, url) {
      const link = document.createElement("a");
      link.href = url;
      link.textContent = `Descargar ${fileName}`;
      link.target = "_blank";
      fileList.appendChild(link);
    }
  </script>
</body>
</html>
